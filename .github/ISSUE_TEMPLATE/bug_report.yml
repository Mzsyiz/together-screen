name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste passwords, cookies, TURN secrets, raw WebRTC dumps or private IP addresses.
        Security vulnerabilities must be reported privately according to SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Log in as ...
        2. Enter room ...
        3. Start sharing ...
        4. Observe ...
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 155, Edge 155, Safari 26
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Local development
        - Docker
        - Reverse proxy / VPS
        - Baota or aaPanel
        - Other
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: WebRTC connection
      options:
        - Direct P2P
        - TURN relay
        - Unknown
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include only relevant metrics. Remove IPs, credentials and personal data.
      placeholder: |
        RTT:
        Packet loss:
        Candidate type:
        Resolution:
        FPS:
        Bitrate:

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, IP addresses and raw diagnostic files.
          required: true
