services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:3000}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      SESSION_DAYS: "${SESSION_DAYS:-30}"
      STUN_URLS: "${STUN_URLS:-stun:stun.l.google.com:19302,stun:stun.cloudflare.com:3478}"
      TURN_URLS: "${TURN_URLS:-}"
      TURN_USERNAME: "${TURN_USERNAME:-}"
      TURN_CREDENTIAL: "${TURN_CREDENTIAL:-}"
      TURN_SECRET: "${TURN_SECRET:-}"
      TURN_CREDENTIAL_TTL_SECONDS: "${TURN_CREDENTIAL_TTL_SECONDS:-3600}"
    volumes:
      - together-data:/data

volumes:
  together-data:
